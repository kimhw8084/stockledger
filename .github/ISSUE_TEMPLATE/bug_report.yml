name: Bug report
description: Report incorrect behavior without sharing private investment data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps using sample or redacted data
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, device/browser, and data mode
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Do not attach account tokens, private notes, full backups, or provider keys.
